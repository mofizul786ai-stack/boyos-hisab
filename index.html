<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বয়স হিসাব</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f8fafc;
}


.header{

text-align:center;
padding:25px;

}


.topbar{

display:flex;
justify-content:space-between;
align-items:center;
padding:10px 20px;

}


.icon{

font-size:28px;

}


.logo{

width:90px;
height:90px;
border-radius:25px;

}


h1{

color:#2563eb;
font-size:35px;

}


.subtitle{

color:#555;
font-size:18px;

}


.card{

background:white;
margin:15px 20px;
padding:20px;
border-radius:30px;
box-shadow:0 5px 20px #0002;

}


.datebox{

background:#f1f5f9;
padding:18px;
border-radius:20px;
font-size:18px;

}


input{

border:none;
background:none;
font-size:18px;
width:100%;

}



.btn{

width:100%;
padding:18px;
margin-top:20px;
border:none;
border-radius:25px;
background:#2563eb;
color:white;
font-size:18px;
font-weight:bold;

}


.info{

display:flex;
align-items:center;
background:#eff6ff;
padding:20px;
border-radius:25px;
margin-top:20px;

}


.circle{

font-size:35px;
margin-right:20px;

}


.value{

color:#2563eb;
font-size:22px;
font-weight:bold;

}


.share{

background:#16a34a;

}


.menu{

position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
border-radius:25px 25px 0 0;

}


.menu a{

text-decoration:none;
color:#555;
text-align:center;

}


.active{

color:#2563eb!important;

}


</style>

</head>


<body>


<div class="topbar">

<div class="icon">☰</div>

<img src="icon.png" class="logo">

<div class="icon">↗</div>

</div>



<div class="header">


<h1>বয়স হিসাব</h1>

<p class="subtitle">
জন্ম তারিখ নির্বাচন করুন
</p>


</div>



<div class="card">


<div class="datebox">

📅

<input type="date" id="birthDate">

</div>



<button class="btn" onclick="calculateAge()">

বয়স হিসাব করুন

</button>



<div class="info">

<div class="circle">🎂</div>

<div>

আপনার বয়স

<br>

<span class="value" id="age">

25 বছর 2 মাস 5 দিন

</span>

</div>


</div>



<div class="info">

<div class="circle">⭐</div>

<div>

আপনার রাশি

<br>

<span class="value">

মিথুন ♊

</span>

</div>

</div>



<button class="btn share">

💬 Share করুন

</button>



</div>





<div class="menu">


<a class="active" href="index.html">

🏠<br>হোম

</a>


<a href="rashi.html">

⭐<br>রাশি

</a>


<a>

🔗<br>শেয়ার

</a>


<a href="more.html">

⚙<br>আরও

</a>


</div>


<script>

function calculateAge(){

let date=document.getElementById("birthDate").value;

if(!date){

alert("জন্ম তারিখ দিন");

return;

}


let birth=new Date(date);

let today=new Date();


let age=today.getFullYear()-birth.getFullYear();


document.getElementById("age").innerHTML=
age+" বছর";


}


</script>


</body>
</html>
