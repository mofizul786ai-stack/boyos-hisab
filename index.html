<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বয়স হিসাব</title>

<meta name="theme-color" content="#2563eb">
<meta name="description" content="সহজে আপনার বয়স ও রাশি হিসাব করুন">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
  "Noto Sans Bengali",
  "Nirmala UI",
  Arial,
  sans-serif;

  background:#eef4ff;
  color:#111827;
  padding-bottom:90px;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:white;
  text-align:center;

  padding:30px 20px 55px;

  border-radius:0 0 55px 55px;

  box-shadow:
  0 10px 30px rgba(37,99,235,.25);
}

.logo{
  width:90px;
  height:90px;
  object-fit:cover;

  border-radius:25px;

  background:white;

  padding:5px;

  box-shadow:
  0 8px 20px rgba(0,0,0,.2);
}

.header h1{
  margin-top:15px;
  font-size:36px;
  font-weight:800;
}

.header p{
  margin-top:8px;
  font-size:18px;
}

/* MAIN */

.container{
  max-width:700px;
  margin:-25px auto 0;
  padding:0 18px;
}

/* CARD */

.card{
  background:white;

  border-radius:35px;

  padding:28px 22px;

  margin-bottom:25px;

  box-shadow:
  0 10px 35px rgba(0,0,0,.08);
}

/* DATE */

.label{
  font-size:21px;
  font-weight:700;
  margin-bottom:15px;
}

.date-input{
  width:100%;

  padding:20px;

  border:2px solid #e5e7eb;

  border-radius:25px;

  font-size:20px;

  background:#f9fafb;

  outline:none;
}

.date-input:focus{
  border-color:#2563eb;
}

/* BUTTON */

.main-btn{
  width:100%;

  margin-top:25px;

  border:none;

  border-radius:50px;

  padding:20px;

  background:#2563eb;

  color:white;

  font-size:23px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
  0 8px 20px rgba(37,99,235,.25);
}

.main-btn:active{
  transform:scale(.98);
}

/* RESULT */

.result-card{
  background:#eef4ff;

  border-radius:30px;

  padding:28px 20px;

  margin-top:25px;

  text-align:center;
}

.result-title{
  font-size:22px;
  font-weight:800;
}

.age-result{
  color:#2563eb;

  font-size:30px;

  font-weight:900;

  margin-top:18px;
}

/* BIRTHDAY */

.birthday{
  margin-top:15px;

  font-size:18px;

  color:#374151;

  line-height:1.7;
}

/* RASHI */

.rashi-card{
  background:#f3f7ff;

  border-radius:30px;

  padding:28px 20px;

  text-align:center;

  margin-top:20px;
}

.rashi-title{
  font-size:22px;
  font-weight:800;
}

.rashi-icon{
  font-size:65px;
  margin:12px 0;
}

.rashi-name{
  color:#2563eb;
  font-size:30px;
  font-weight:900;
}

/* SHARE */

.share-btn{
  width:100%;

  border:none;

  border-radius:50px;

  padding:18px;

  margin-top:20px;

  background:#16a34a;

  color:white;

  font-size:21px;

  font-weight:800;
}

/* AD */

.ad-box{
  background:white;

  border-radius:30px;

  padding:25px;

  margin:25px 0;

  text-align:center;

  color:#9ca3af;

  box-shadow:
  0 5px 20px rgba(0,0,0,.05);
}

.ad-label{
  font-size:14px;
  margin-bottom:15px;
}

.ad-content{
  background:#f9fafb;

  border-radius:20px;

  padding:30px 10px;

  font-size:18px;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:78px;

  background:rgba(255,255,255,.97);

  backdrop-filter:blur(10px);

  display:flex;

  justify-content:space-around;

  align-items:center;

  border-radius:30px 30px 0 0;

  box-shadow:
  0 -5px 25px rgba(0,0,0,.10);

  z-index:999;
}

.bottom a{
  text-decoration:none;

  color:#9ca3af;

  text-align:center;

  font-size:14px;

  min-width:70px;
}

.bottom a.active{
  color:#2563eb;
}

.bottom .icon{
  display:block;

  font-size:25px;

  margin-bottom:3px;
}

/* SMALL SCREEN */

@media(max-width:450px){

  .header h1{
    font-size:32px;
  }

  .header p{
    font-size:17px;
  }

  .age-result{
    font-size:25px;
  }

}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

  <img
    src="icon.png"
    class="logo"
    alt="বয়স হিসাব"
  >

  <h1>বয়স হিসাব</h1>

  <p>জন্ম তারিখ নির্বাচন করুন</p>

</header>



<!-- MAIN -->

<main class="container">


  <!-- DATE CARD -->

  <section class="card">

    <div class="label">
      📅 জন্ম তারিখ নির্বাচন করুন
    </div>

    <input
      type="date"
      id="birthDate"
      class="date-input"
    >

    <button
      class="main-btn"
      onclick="calculateAge()"
    >
      বয়স হিসাব করুন
    </button>


    <!-- RESULT -->

    <div
      id="result"
      class="result-card"
      style="display:none;"
    >

      <div class="result-title">
        🎂 আপনার বয়স
      </div>

      <div
        id="ageResult"
        class="age-result"
      >
      </div>

      <div
        id="birthdayResult"
        class="birthday"
      >
      </div>

    </div>


    <!-- RASHI -->

    <div
      id="rashiCard"
      class="rashi-card"
      style="display:none;"
    >

      <div class="rashi-title">
        ⭐ আপনার রাশি
      </div>

      <div
        id="rashiIcon"
        class="rashi-icon"
      >
        ⭐
      </div>

      <div
        id="rashiName"
        class="rashi-name"
      >
      </div>

    </div>


    <!-- SHARE -->

    <button
      class="share-btn"
      onclick="shareApp()"
    >
      🟢 Share করুন
    </button>

  </section>



  <!-- ADVERTISEMENT -->

  <div class="ad-box">

    <div class="ad-label">
      Advertisement
    </div>

    <div class="ad-content">
      বিজ্ঞাপনের জায়গা
    </div>

  </div>


</main>



<!-- BOTTOM NAVIGATION -->

<nav class="bottom">

  <a
    href="index.html"
    class="active"
  >
    <span class="icon">🏠</span>
    হোম
  </a>


  <a href="rashi.html">

    <span class="icon">⭐</span>

    রাশি

  </a>


  <a href="birthday.html">

    <span class="icon">🔔</span>

    Reminder

  </a>


  <a href="more.html">

    <span class="icon">⚙️</span>

    আরও

  </a>

</nav>



<!-- JAVASCRIPT -->

<script>


/* =========================
   AGE CALCULATOR
========================= */

function calculateAge(){

  const input =
    document.getElementById("birthDate");

  const birth =
    new Date(input.value);

  if(!input.value){

    alert("দয়া করে জন্ম তারিখ নির্বাচন করুন।");

    return;
  }


  const today =
    new Date();


  if(birth > today){

    alert("জন্ম তারিখ ভবিষ্যতের হতে পারে না।");

    return;
  }


  let years =
    today.getFullYear()
    - birth.getFullYear();

  let months =
    today.getMonth()
    - birth.getMonth();

  let days =
    today.getDate()
    - birth.getDate();


  if(days < 0){

    months--;

    const previousMonth =
      new Date(
        today.getFullYear(),
        today.getMonth(),
        0
      );

    days +=
      previousMonth.getDate();
  }


  if(months < 0){

    years--;

    months += 12;
  }


  document.getElementById("ageResult").innerHTML =
    years + " বছর " +
    months + " মাস " +
    days + " দিন";


  /* NEXT BIRTHDAY */

  showNextBirthday(birth);


  /* RASHI */

  showRashi(birth);


  /* SHOW RESULT */

  document.getElementById("result")
    .style.display = "block";

  document.getElementById("rashiCard")
    .style.display = "block";


  /* SAVE DATE */

  localStorage.setItem(
    "birthday",
    input.value
  );

}



/* =========================
   NEXT BIRTHDAY
========================= */

function showNextBirthday(birth){

  const today =
    new Date();


  let next =
    new Date(
      today.getFullYear(),
      birth.getMonth(),
      birth.getDate()
    );


  if(next < today){

    next.setFullYear(
      today.getFullYear() + 1
    );

  }


  const diff =
    next - today;


  const days =
    Math.floor(
      diff /
      (1000 * 60 * 60 * 24)
    );


  const hours =
    Math.floor(
      (diff /
      (1000 * 60 * 60)) % 24
    );


  const minutes =
    Math.floor(
      (diff /
      (1000 * 60)) % 60
    );


  document.getElementById(
    "birthdayResult"
  ).innerHTML =

    "🎂 পরবর্তী জন্মদিন বাকি:<br>" +

    "<b>" +
    days +
    " দিন " +
    hours +
    " ঘণ্টা " +
    minutes +
    " মিনিট" +
    "</b>";

}



/* =========================
   RASHI
========================= */

function showRashi(date){

  const day =
    date.getDate();

  const month =
    date.getMonth() + 1;


  let name = "";
  let icon = "";


  if(
    (month === 3 && day >= 21) ||
    (month === 4 && day <= 19)
  ){

    name = "মেষ";
    icon = "♈";

  }

  else if(
    (month === 4 && day >= 20) ||
    (month === 5 && day <= 20)
  ){

    name = "বৃষ";
    icon = "♉";

  }

  else if(
    (month === 5 && day >= 21) ||
    (month === 6 && day <= 20)
  ){

    name = "মিথুন";
    icon = "♊";

  }

  else if(
    (month === 6 && day >= 21) ||
    (month === 7 && day <= 22)
  ){

    name = "কর্কট";
    icon = "♋";

  }

  else if(
    (month === 7 && day >= 23) ||
    (month === 8 && day <= 22)
  ){

    name = "সিংহ";
    icon = "♌";

  }

  else if(
    (month === 8 && day >= 23) ||
    (month === 9 && day <= 22)
  ){

    name = "কন্যা";
    icon = "♍";

  }

  else if(
    (month === 9 && day >= 23) ||
    (month === 10 && day <= 22)
  ){

    name = "তুলা";
    icon = "♎";

  }

  else if(
    (month === 10 && day >= 23) ||
    (month === 11 && day <= 21)
  ){

    name = "বৃশ্চিক";
    icon = "♏";

  }

  else if(
    (month === 11 && day >= 22) ||
    (month === 12 && day <= 21)
  ){

    name = "ধনু";
    icon = "♐";

  }

  else if(
    (month === 12 && day >= 22) ||
    (month === 1 && day <= 19)
  ){

    name = "মকর";
    icon = "♑";

  }

  else if(
    (month === 1 && day >= 20) ||
    (month === 2 && day <= 18)
  ){

    name = "কুম্ভ";
    icon = "♒";

  }

  else{

    name = "মীন";
    icon = "♓";

  }


  document.getElementById(
    "rashiName"
  ).innerHTML = name;


  document.getElementById(
    "rashiIcon"
  ).innerHTML = icon;

}



/* =========================
   SHARE APP
========================= */

function shareApp() {
    const text =
        "🎂 বয়স হিসাব App\n\n" +
        "আমার বয়স হিসাব করুন ❤️\n\n" +
        window.location.href;

    if (navigator.share) {
        navigator.share({
            title: "বয়স হিসাব",
            text: text
        }).catch(function () {
            console.log("Share cancelled");
        });
    } else {
        alert(text);
    }
}
  


/* =========================
   LOAD SAVED DATE
========================= */
<script>
window.addEventListener(
  "DOMContentLoaded",
  function(){

    const saved =
      localStorage.getItem(
        "birthday"
      );


    if(saved){

      document.getElementById(
        "birthDate"
      ).value = saved;

    }

  }
);


</script>


</body>
          </html>
