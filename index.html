<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বয়স হিসাব</title>

<style>

body{
 margin:0;
 font-family: sans-serif;
 background:#f5f8ff;
 color:#222;
}

.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:20px;
}

.logo{
 width:80px;
 height:80px;
 border-radius:20px;
}

.icon{
 font-size:28px;
}

.container{
 padding:20px;
}

h1{
 text-align:center;
 color:#1565ff;
 font-size:38px;
}

.subtitle{
 text-align:center;
 color:#777;
}

.box{
 background:white;
 padding:20px;
 border-radius:25px;
 margin-top:20px;
 box-shadow:0 5px 15px #ddd;
}

input{
 width:90%;
 padding:18px;
 border-radius:20px;
 border:1px solid #ddd;
 font-size:18px;
}

button{
 width:100%;
 padding:18px;
 margin-top:15px;
 border:none;
 border-radius:25px;
 background:#2166ff;
 color:white;
 font-size:20px;
}

.card{
 background:#eef5ff;
 padding:25px;
 border-radius:25px;
 margin-top:20px;
}

.card h3{
 margin:0;
}

.big{
 font-size:28px;
 color:#145cff;
 font-weight:bold;
}

.share{
 background:#10b95b;
}

.bottom{
 position:fixed;
 bottom:0;
 width:100%;
 background:white;
 display:flex;
 justify-content:space-around;
 padding:15px 0;
 border-radius:25px 25px 0 0;
}

.bottom div{
 text-align:center;
 color:#555;
}


</style>

</head>

<body>


<div class="header">

<div class="icon">☰</div>

<img src="icon.png" class="logo">

<div class="icon">🔗</div>

</div>


<div class="container">


<h1>বয়স হিসাব</h1>

<p class="subtitle">
জন্ম তারিখ নির্বাচন করুন
</p>


<div class="box">

<input type="date" id="birthDate">


<button onclick="calculateAge()">
বয়স হিসাব করুন
</button>

</div>



<div class="card">

<h3>🎂 আপনার বয়স</h3>

<p class="big" id="age">
25 বছর 2 মাস 5 দিন
</p>

</div>



<div class="card">

<h3>⭐ আপনার রাশি</h3>

<p class="big">
♊ মিথুন
</p>

</div>



<button class="share">
🟢 Share করুন
</button>



</div>



<div class="bottom">

<div>
🏠<br>
হোম
</div>

<div>
⭐<br>
রাশি
</div>

<div>
🔗<br>
শেয়ার
</div>

<div>
⚙️<br>
আরও
</div>

</div>



<script>

function calculateAge(){

let date=document.getElementById("birthDate").value;

if(date){

document.getElementById("age").innerHTML=
"বয়স হিসাব হয়েছে ✅";

}

}

</script>


</body>
</html>
