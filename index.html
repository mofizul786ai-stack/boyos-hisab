<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বয়স হিসাব</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f4f7ff;
padding-bottom:90px;
}


.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
}


.logo{
width:80px;
height:80px;
border-radius:22px;
}


.icon{
font-size:28px;
}


.container{
padding:20px;
}


.title{
text-align:center;
font-size:38px;
color:#1765ff;
font-weight:bold;
}


.sub{
text-align:center;
color:#777;
}


.box{
background:white;
padding:20px;
border-radius:25px;
margin-top:20px;
}


input{
width:90%;
padding:18px;
border-radius:20px;
border:1px solid #ddd;
font-size:18px;
}


.btn{
width:100%;
padding:18px;
margin-top:20px;
border:none;
border-radius:25px;
background:#1765ff;
color:white;
font-size:20px;
}


.card{
background:#eef5ff;
margin-top:20px;
padding:25px;
border-radius:25px;
}


.card h3{
margin:0;
}


.value{
font-size:28px;
font-weight:bold;
color:#1765ff;
}


.share{
background:#12b95a;
}


.bottom{

position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:15px 0;
border-radius:25px 25px 0 0;
box-shadow:0 -3px 15px #ddd;

}


.bottom div{

text-align:center;
font-size:14px;
color:#555;

}


</style>

</head>


<body>


<div class="header">

<div class="icon">☰</div>

<img src="icon.png" class="logo">

<div class="icon">🔗</div>

</div>



<div class="container">


<div class="title">
বয়স হিসাব
</div>


<p class="sub">
জন্ম তারিখ নির্বাচন করুন
</p>



<div class="box">

<input type="date" id="birthDate">


<button class="btn" onclick="calculateAge()">
বয়স হিসাব করুন
</button>

</div>




<div class="card">

<h3>🎂 আপনার বয়স</h3>

<p class="value" id="age">
আপনার বয়স এখানে দেখাবে
</p>

</div>




<div class="card">

<h3>⭐ আপনার রাশি</h3>

<p class="value" id="rashi">
রাশি এখানে দেখাবে
</p>

</div>




<button class="btn share" onclick="shareApp()">

🟢 Share করুন

</button>



</div>





<div class="bottom">


<div onclick="location.href='index.html'">
🏠<br>
হোম
</div>


<div onclick="location.href='rashi.html'">
⭐<br>
রাশি
</div>


<div onclick="location.href='birthday.html'">
🔔<br>
Reminder
</div>


<div onclick="location.href='more.html'">
⚙️<br>
আরও
</div>


</div>






<script>


function calculateAge(){


let dob=new Date(document.getElementById("birthDate").value);


let today=new Date();


let age=today.getFullYear()-dob.getFullYear();


let month=today.getMonth()-dob.getMonth();


if(month<0){

age--;

}


document.getElementById("age").innerHTML=
age+" বছর";


let day=dob.getDate();
let mon=dob.getMonth()+1;


let r="";


if(mon==5 && day>=21 || mon==6 && day<=20){

r="♊ মিথুন";

}
else if(mon==4 && day>=21 || mon==5 && day<=20){

r="♉ বৃষ";

}
else{

r="⭐ আপনার রাশি";

}


document.getElementById("rashi").innerHTML=r;


}




function shareApp(){

if(navigator.share){

navigator.share({

title:"বয়স হিসাব App",

text:"আমার বয়স হিসাব করুন",

url:location.href

});

}

}



</script>


</body>

 </html>
