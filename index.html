*{

body{

}


/* Splash */

#splash{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:linear-gradient(135deg,#2563eb,#60a5fa);
 color:white;

}


.logo{

}


h1{

}


p{

}


input{

.result{

.share{

}


</style>

</head>

</html>
