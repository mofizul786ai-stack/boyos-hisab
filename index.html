<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বয়স হিসাব</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f3f7ff;
color:#111;
}

.header{
background:#2563eb;
color:white;
padding:25px;
text-align:center;
border-radius:0 0 30px 30px;
}

.logo{
width:80px;
height:80px;
border-radius:20px;
margin-top:10px;
}

.header h1{
font-size:32px;
margin:10px 0;
}


.container{
padding:20px;
}


.box{
background:white;
padding:20px;
border-radius:30px;
box-shadow:0 5px 20px #ddd;
}


input{
width:100%;
padding:18px;
border-radius:20px;
border:1px solid #ddd;
font-size:18px;
box-sizing:border-box;
}


button{
width:100%;
padding:18px;
margin-top:20px;
border:none;
border-radius:30px;
background:#2563eb;
color:white;
font-size:20px;
}


.card{

background:#edf4ff;
padding:25px;
margin-top:25px;
border-radius:30px;

}


.card h2{
font-size:22px;
}


.result{

font-size:30px;
font-weight:bold;
color:#2563eb;

}


.rashi{

font-size:32px;
font-weight:bold;
color:#2563eb;

}


.share{

background:#16b957;

}


.reminder{

background:#ec4899;

}


.bottom{

position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
border-radius:25px 25px 0 0;
box-shadow:0 -5px 20px #ddd;

}


.bottom div{

font-size:16px;
text-align:center;

}


</style>

</head>


<body>


<div class="header">

<img src="icon.png" class="logo">

<h1>বয়স হিসাব</h1>

<p>জন্ম তারিখ নির্বাচন করুন</p>

</div>



<div class="container">


<div class="box">


<input type="date" id="birthDate">


<button onclick="calculateAge()">
বয়স হিসাব করুন
</button>


</div>



<div class="card">

<h2>🎂 আপনার বয়স</h2>

<div class="result" id="age">
25 বছর 2 মাস 5 দিন
</div>

</div>




<div class="card">

<h2>⭐ আপনার রাশি</h2>

<div class="rashi" id="rashi">

♊ মিথুন

</div>

</div>



<button class="share" onclick="shareApp()">

🟢 Share করুন

</button>



<button class="reminder" onclick="enableNotification()">

🔔 Notification চালু করুন

</button>



</div>




<div class="bottom">


<div>
🏠<br>
হোম
</div>


<div>
⭐<br>
রাশি
</div>


<div>
🔔<br>
Reminder
</div>


<div>
⚙️<br>
আরও
</div>


</div>




<script>

function calculateAge(){

let dob = new Date(document.getElementById("birthDate").value);

if(!dob){
alert("জন্ম তারিখ নির্বাচন করুন");
return;
}

let today = new Date();


let years = today.getFullYear() - dob.getFullYear();
let months = today.getMonth() - dob.getMonth();
let days = today.getDate() - dob.getDate();


if(days < 0){

months--;

let lastMonth = new Date(
today.getFullYear(),
today.getMonth(),
0
);

days += lastMonth.getDate();

}


if(months < 0){

years--;
months += 12;

}



document.getElementById("age").innerHTML =
years+" বছর "+months+" মাস "+days+" দিন";



// Rashi Calculation

let day = dob.getDate();
let month = dob.getMonth()+1;


let rashi="";


if((month==5 && day>=21)||(month==6 && day<=20)){
rashi="♊ মিথুন";
}

else if((month==4 && day>=21)||(month==5 && day<=20)){
rashi="♉ বৃষ";
}

else if((month==6 && day>=21)||(month==7 && day<=22)){
rashi="♋ কর্কট";
}

else if((month==7 && day>=23)||(month==8 && day<=22)){
rashi="♌ সিংহ";
}

else if((month==8 && day>=23)||(month==9 && day<=22)){
rashi="♍ কন্যা";
}

else if((month==9 && day>=23)||(month==10 && day<=22)){
rashi="♎ তুলা";
}

else if((month==10 && day>=23)||(month==11 && day<=21)){
rashi="♏ বৃশ্চিক";
}

else if((month==11 && day>=22)||(month==12 && day<=21)){
rashi="♐ ধনু";
}

else if((month==12 && day>=22)||(month==1 && day<=19)){
rashi="♑ মকর";
}

else if((month==1 && day>=20)||(month==2 && day<=18)){
rashi="♒ কুম্ভ";
}

else if((month==2 && day>=19)||(month==3 && day<=20)){
rashi="♓ মীন";
}

else{
rashi="♈ মেষ";
}


document.getElementById("rashi").innerHTML=rashi;

}



// Share Button

function shareApp(){

if(navigator.share){

navigator.share({

title:"বয়স হিসাব App",

text:"আমার বয়স হিসাব করুন ❤️",

url:location.href

});

}

else{

alert("Share Support নেই");

}

}



// Notification

function enableNotification(){

if("Notification" in window){

Notification.requestPermission()
.then(function(permission){

if(permission=="granted"){

new Notification(
"🎂 বয়স হিসাব",
{
body:"Notification চালু হয়েছে ❤️"
}
);

}

});

}

 }


</script>


</body>

</html>
