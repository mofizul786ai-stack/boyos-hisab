<!DOCTYPE html>
<html>
<head>
<title>বয়স হিসাব</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<link rel="apple-touch-icon" href="icon.png">

<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  #splash{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #2563eb;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#splash img{
  border-radius: 20px;
  margin-bottom: 20px;
}

#splash h1{
  font-size: 32px;
}

#splash p{
  font-size: 18px;
}
body{
  font-family: Arial;
  background:#f2f5ff;
  text-align:center;
  padding:30px;
}

.box{
  background:white;
  padding:30px;
  border-radius:25px;
  max-width:350px;
  margin:auto;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}
button{
  background:#2563eb;
  color:white;
  border:none;
  border-radius:15px;
  padding:14px;
  width:90%;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}
.box h1{
  color:#2563eb;
  font-size:28px;
}
  button{
  background:#2563eb;
  color:white;
  border:none;
  padding:14px;
  border-radius:15px;
  font-size:17px;
  width:90%;
  margin:12px;
  box-shadow:0 8px 15px rgba(0,0,0,0.2);
}

.box p{
  font-size:18px;
  color:#555;
}

input,button{
  width:90%;
  padding:14px;
  margin:12px;
  border-radius:15px;
  font-size:17px;
}

input{
  border:2px solid #ddd;
}
  input{
  background:#f5f5f5;
  outline:none;
  }

button{
  background:#2563eb;
  color:white;
  border:none;
  font-weight:bold;
}

button:hover{
  background:#1d4ed8;
}

#result{
  margin-top:20px;
  padding:15px;
  background:#f1f5ff;
  border-radius:15px;
  font-size:18px;
}
  #result{
  margin-top:20px;
  font-size:18px;
  color:#111;
}

h1{
  color:#2563eb;
}

input,button{
  width:90%;
  padding:12px;
  margin:10px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
}

#result{
  margin-top:20px;
  font-size:18px;
  color:#111;
}
  .loader{
  width:40px;
  height:40px;
  border:5px solid #ffffff;
  border-top:5px solid #2563eb;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-top:20px;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}
</style>

</head>

<body>
  <div id="splash">
  <img src="icon.png" width="120">
  <h1>বয়স হিসাব</h1>
  <p>আপনার বয়স জানুন সহজে</p>
    <div class="loader"></div>
</div>

<script>
setTimeout(function(){
 document.getElementById("splash").style.display="none";
},2000);
</script>

<div class="box">

<h1>বয়স হিসাব</h1>

<p>জন্ম তারিখ দিন</p>

<input type="date" id="dob">
<button onclick="calculateAge()">Calculate</button>
<button onclick="shareAge()">📤 বয়স শেয়ার করুন</button>


<div id="result"></div>

</div>


<script>

function calculateAge(){

let dob = document.getElementById("dob").value;

if(dob==""){
alert("জন্ম তারিখ নির্বাচন করুন");
return;
}

let birth = new Date(dob);
let today = new Date();

let year = today.getFullYear()-birth.getFullYear();
let month = today.getMonth()-birth.getMonth();
let day = today.getDate()-birth.getDate();

if(day<0){
month--;
day += new Date(today.getFullYear(), today.getMonth(),0).getDate();
}

if(month<0){
year--;
month+=12;
}

let nextBirthday = new Date(
today.getFullYear(),
birth.getMonth(),
birth.getDate()
);

if(nextBirthday < today){
nextBirthday.setFullYear(today.getFullYear()+1);
}

let remain = Math.ceil(
(nextBirthday - today)/(1000*60*60*24)
);

let totalDays = Math.floor(
(today - birth) / (1000 * 60 * 60 * 24)
);

let totalHours = totalDays * 24;


document.getElementById("result").innerHTML =
"আপনার বয়স:<br><b>"+
year+" বছর "+month+" মাস "+day+" দিন</b><br><br>"+
"📅 মোট দিন: "+totalDays+" দিন<br>"+
"⏰ মোট ঘণ্টা: "+totalHours+" ঘণ্টা<br><br>"+
"🎂 পরের জন্মদিন: "+remain+" দিন বাকি";
"🎂 পরের জন্মদিন: "+remain+" দিন বাকি";
shareText =
"আমার বয়স: "+year+" বছর "+month+" মাস "+day+" দিন\n"+
"মোট দিন: "+totalDays+" দিন\n"+
"মোট ঘণ্টা: "+totalHours+" ঘণ্টা\n"+
"পরের জন্মদিন: "+remain+" দিন বাকি";
}
let shareText = "";

function shareAge(){

if(shareText==""){
alert("আগে বয়স হিসাব করুন");
return;
}

if(navigator.share){

navigator.share({
title:"বয়স হিসাব",
text:shareText
});

}else{

alert(shareText);

}

}
</script>


</body>
</html>
