<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Reminder</title>

<style>

*{
 box-sizing:border-box;
 font-family:Arial,sans-serif;
}

body{
 margin:0;
 min-height:100vh;
 background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.top{
 background:#2563eb;
 color:white;
 padding:25px;
 text-align:center;
 border-radius:0 0 35px 35px;
}

.top h1{
 margin:10px;
 font-size:28px;
}

.cake{
 font-size:80px;
 margin-top:20px;
}

.card{
 background:white;
 margin:-20px 20px 20px;
 padding:25px;
 border-radius:35px;
 box-shadow:0 10px 25px #0003;
}

label{
 color:#555;
 font-size:16px;
}

.date{
 background:#eff6ff;
 padding:18px;
 margin-top:15px;
 border-radius:20px;
 color:#2563eb;
 font-size:20px;
 font-weight:bold;
}


.next{
 margin-top:20px;
 padding:25px;
 background:#fff1f2;
 border-radius:25px;
 color:#e11d48;
}

.next h2{
 font-size:55px;
 margin:5px;
}


.option{
 margin-top:15px;
 padding:18px;
 background:#fef3c7;
 border-radius:20px;
}


.notify{
 background:#eff6ff;
}


button{
 width:100%;
 padding:16px;
 margin-top:15px;
 border:none;
 border-radius:20px;
 font-size:18px;
 font-weight:bold;
 color:white;
 background:#ec4899;
}


.menu{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 display:flex;
 justify-content:space-around;
 padding:15px;
 border-radius:25px 25px 0 0;
}


.menu div{
 text-align:center;
 color:#555;
}


.active{
 color:#2563eb!important;
}


</style>

</head>

<body>


<div class="top">

<div class="cake">🎂</div>

<h1>Birthday Reminder</h1>

</div>


<div class="card">


<label>আপনার জন্ম তারিখ</label>


<div class="date">
🎂 28/05/2001
</div>


<div class="next">

<h3>পরবর্তী জন্মদিন</h3>

<h2 id="days">23</h2>

<p>দিন বাকি 🎉</p>

</div>



<div class="option">

⏰ Reminder সেট করুন

<br>

জন্মদিনের আগে রিমাইন্ডার পাবেন

</div>



<div class="option notify">

🔔 Notification চালু করুন

<input type="checkbox" checked>

</div>



<button onclick="shareCard()">

🎉 Birthday Card Share করুন

</button>


</div>



<div class="menu">

<div>🏠<br>হোম</div>

<div>⭐<br>রাশি</div>

<div class="active">🔔<br>Reminder</div>

<div>⚙<br>আরও</div>

</div>



<script>


function shareCard(){

navigator.share({

title:"Birthday Reminder",

text:"আমার Birthday Reminder দেখুন 🎂",

url:location.href

});

}



</script>

<script>

// Notification Permission
function enableNotification(){

if ("Notification" in window){

Notification.requestPermission().then(function(permission){

if(permission === "granted"){

new Notification("🎂 Birthday Reminder",{
body:"আপনার জন্মদিনের Reminder চালু হয়েছে ❤️",
icon:"https://cdn-icons-png.flaticon.com/512/3174/3174767.png"
});

alert("Notification চালু হয়েছে ✅");

}

});

}

}


// Birthday Share Card
function shareBirthday(){

let date = document.getElementById("birthDate").value;

let text = 
"🎂 Birthday Reminder\n\n"+
"আমার জন্মদিন: "+date+
"\n\nএই অ্যাপ দিয়ে জন্মদিন মনে রাখুন ❤️";


if(navigator.share){

navigator.share({

title:"Birthday Reminder",

text:text

});

}else{

alert(text);

}

}


// Auto Birthday Notification Check

function checkBirthday(){

let savedDate = localStorage.getItem("birthday");

if(!savedDate) return;


let today = new Date();

let birthday = new Date(savedDate);


if(
today.getDate()==birthday.getDate() &&
today.getMonth()==birthday.getMonth()
){

if(Notification.permission=="granted"){

new Notification("🎉 শুভ জন্মদিন!",{

body:"আজ আপনার বিশেষ দিন ❤️"

});

}

}

}


setInterval(checkBirthday,60000);


</script>
</body>
</html>
