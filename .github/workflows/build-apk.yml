name: Build Boyos Hisab

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Setup Java
      # --------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # --------------------------------
      # 3. Setup Android SDK
      # --------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------
      # 4. Create Android folders
      # --------------------------------
      - name: Create Android Project
        shell: bash
        run: |

          set -e

          echo "Creating Android project..."

          mkdir -p app/src/main/java/com/mofizul786ai/boyoshisab
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable


          # --------------------------------
          # Check icon
          # --------------------------------

          if [ ! -f "icon.png" ]; then

            echo "ERROR: icon.png not found in repository!"

            exit 1

          fi


          cp icon.png \
          app/src/main/res/drawable/app_icon.png


          # --------------------------------
          # settings.gradle
          # --------------------------------

          cat > settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()

                  mavenCentral()

              }

          }


          rootProject.name = "BoyosHisab"

          include(":app")

          EOF


          # --------------------------------
          # Root build.gradle
          # --------------------------------

          cat > build.gradle <<'EOF'

          plugins {

              id 'com.android.application'
              version '8.7.3'
              apply false

          }

          EOF


          # --------------------------------
          # App build.gradle
          # --------------------------------

          cat > app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'

          }


          android {

              namespace 'com.mofizul786ai.boyoshisab'

              compileSdk 35


              defaultConfig {

                  applicationId 'com.mofizul786ai.boyoshisab'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"

              }


              buildTypes {

                  debug {

                      minifyEnabled false

                  }


                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

          }

          EOF


          # --------------------------------
          # styles.xml
          # --------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #2563EB
                  </item>

                  <item name="android:statusBarColor">
                      #2563EB
                  </item>

                  <item name="android:navigationBarColor">
                      #F3F7FF
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>

          EOF


          # --------------------------------
          # AndroidManifest.xml
          # --------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:icon="@drawable/app_icon"

                  android:label="বয়স হিসাব"

                  android:roundIcon="@drawable/app_icon"

                  android:supportsRtl="true"

                  android:theme="@style/AppTheme">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:screenOrientation="portrait">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>


          </manifest>

          EOF


          # --------------------------------
          # MainActivity.java
          # --------------------------------

          cat > app/src/main/java/com/mofizul786ai/boyoshisab/MainActivity.java <<'EOF'

          package com.mofizul786ai.boyoshisab;


          import android.app.Activity;

          import android.os.Bundle;

          import android.webkit.WebChromeClient;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;


          public class MainActivity extends Activity {


              private WebView webView;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  webView = new WebView(this);


                  setContentView(webView);


                  WebSettings settings =
                      webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);


                  webView.setWebViewClient(
                      new WebViewClient()
                  );


                  webView.setWebChromeClient(
                      new WebChromeClient()
                  );


                  webView.loadUrl(
                      "https://mofizul786ai-stack.github.io/boyos-hisab/"
                  );

              }


              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }

          }

          EOF


          echo "Android project created successfully."


      # --------------------------------
      # 5. Install Gradle
      # --------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # --------------------------------
      # 6. Build Debug APK
      # --------------------------------

      - name: Build Debug APK
        run: |

          gradle :app:assembleDebug --stacktrace


      # --------------------------------
      # 7. Prepare APK
      # --------------------------------

      - name: Prepare APK
        run: |

          mkdir -p release

          cp \
          app/build/outputs/apk/debug/app-debug.apk \
          release/Boyos-Hisab.apk


      # --------------------------------
      # 8. Build Release AAB
      # --------------------------------

      - name: Build Release AAB
        run: |

          gradle :app:bundleRelease --stacktrace


      # --------------------------------
      # 9. Prepare AAB
      # --------------------------------

      - name: Prepare AAB
        run: |

          mkdir -p release

          cp \
          app/build/outputs/bundle/release/app-release.aab \
          release/Boyos-Hisab.aab


      # --------------------------------
      # 10. Upload APK
      # --------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Boyos-Hisab-APK

          path: release/Boyos-Hisab.apk

          if-no-files-found: error


      # --------------------------------
      # 11. Upload AAB
      # --------------------------------

      - name: Upload AAB
        uses: actions/upload-artifact@v4

        with:

          name: Boyos-Hisab-AAB

          path: release/Boyos-Hisab.aab

          if-no-files-found: error
