name: Build Boyos Hisab Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Release APK and AAB

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout

        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java 17
      # ==========================================

      - name: Setup Java 17

        uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Setup Android SDK
      # ==========================================

      - name: Setup Android SDK

        uses: android-actions/setup-android@v3


      # ==========================================
      # 4. Install Android SDK
      # ==========================================

      - name: Install Android SDK

        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 5. Create Android Project
      # ==========================================

      - name: Create Android Project

        run: |

          set -e

          rm -rf BoyosHisab

          mkdir -p BoyosHisab
          mkdir -p BoyosHisab/app
          mkdir -p BoyosHisab/app/src/main/java/com/boyoshisab/app
          mkdir -p BoyosHisab/app/src/main/res/layout
          mkdir -p BoyosHisab/app/src/main/res/values
          mkdir -p BoyosHisab/app/src/main/res/drawable
          mkdir -p BoyosHisab/app/src/main/assets


      # ==========================================
      # 6. Gradle Properties
      # ==========================================

      - name: Create Gradle Properties

        working-directory: BoyosHisab

        run: |

          cat > gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true

          EOF


      # ==========================================
      # 7. Gradle Settings
      # ==========================================

      - name: Create Gradle Settings

        working-directory: BoyosHisab

        run: |

          cat > settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()
                  mavenCentral()
                  gradlePluginPortal()

              }

          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()
                  mavenCentral()

              }

          }


          rootProject.name = "BoyosHisab"

          include(":app")

          EOF


      # ==========================================
      # 8. Root Gradle
      # ==========================================

      - name: Create Root Gradle

        working-directory: BoyosHisab

        run: |

          cat > build.gradle <<'EOF'

          plugins {

              id 'com.android.application'
                  version '8.6.1'
                  apply false

          }

          EOF


      # ==========================================
      # 9. Restore Permanent Signing Key
      # ==========================================

      - name: Restore Signing Key

        working-directory: BoyosHisab

        env:

          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        run: |

          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then

            echo "ERROR: KEYSTORE_BASE64 secret is missing."

            exit 1

          fi


          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > release.keystore


          if [ ! -s release.keystore ]; then

            echo "ERROR: release.keystore is empty."

            exit 1

          fi


          echo "Permanent signing keystore restored."

          ls -lh release.keystore


      # ==========================================
      # 10. Create App Gradle
      # ==========================================

      - name: Create App Gradle

        working-directory: BoyosHisab

        run: |

          cat > app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'

          }


          android {

              namespace 'com.boyoshisab.app'

              compileSdk 35


              defaultConfig {

                  applicationId "com.boyoshisab.app"

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"

              }


              signingConfigs {

                  release {

                      storeFile file("../release.keystore")

                      storePassword System.getenv(
                          "KEYSTORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "KEY_PASSWORD"
                      )

                  }

              }


              buildTypes {

                  debug {

                      minifyEnabled false

                  }


                  release {

                      signingConfig signingConfigs.release

                      minifyEnabled false

                      shrinkResources false

                  }

              }

          }


          dependencies {

              implementation 'com.google.android.gms:play-services-ads:24.5.0'

          }

          EOF


      # ==========================================
      # 11. Android Manifest
      # ==========================================

      - name: Create Android Manifest

        working-directory: BoyosHisab

        run: |

          cat > app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:label="বয়স হিসাব"

                  android:icon="@drawable/app_icon"

                  android:roundIcon="@drawable/app_icon"

                  android:supportsRtl="true"

                  android:theme="@style/AppTheme">


                  <!-- ================================= -->
                  <!-- ADMOB APP ID -->
                  <!-- ================================= -->

                  <meta-data

                      android:name="com.google.android.gms.ads.APPLICATION_ID"

                      android:value="ca-app-pub-4629127200038980~5718715166" />


                  <activity

                      android:name=".MainActivity"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>


          </manifest>

          EOF


      # ==========================================
      # 12. App Theme
      # ==========================================

      - name: Create App Theme

        working-directory: BoyosHisab

        run: |

          cat > app/src/main/res/values/styles.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>


              <style

                  name="AppTheme"

                  parent="android:style/Theme.Material.Light.NoActionBar">


                  <item name="android:fontFamily">
                      sans
                  </item>


                  <item name="android:colorAccent">
                      #2196F3
                  </item>


                  <item name="android:statusBarColor">
                      #1565C0
                  </item>


                  <item name="android:navigationBarColor">
                      #FFFFFF
                  </item>


                  <item name="android:windowLightStatusBar">
                      false
                  </item>


              </style>


          </resources>

          EOF


      # ==========================================
      # 13. Main Layout
      # ==========================================

      - name: Create Main Layout

        working-directory: BoyosHisab

        run: |

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout

              xmlns:android="http://schemas.android.com/apk/res/android"

              xmlns:ads="http://schemas.android.com/apk/res-auto"

              android:layout_width="match_parent"

              android:layout_height="match_parent"

              android:orientation="vertical"

              android:background="#FFFFFF">


              <WebView

                  android:id="@+id/webView"

                  android:layout_width="match_parent"

                  android:layout_height="0dp"

                  android:layout_weight="1"

                  android:overScrollMode="never" />


              <!-- ================================= -->
              <!-- ADMOB BANNER -->
              <!-- ================================= -->


              <com.google.android.gms.ads.AdView

                  android:id="@+id/adView"

                  android:layout_width="match_parent"

                  android:layout_height="wrap_content"

                  ads:adSize="BANNER"

                  ads:adUnitId="ca-app-pub-4629127200038980/4349793174" />


          </LinearLayout>

          EOF


      # ==========================================
      # 14. MainActivity
      # ==========================================

      - name: Create MainActivity

        working-directory: BoyosHisab

        run: |

          cat > app/src/main/java/com/boyoshisab/app/MainActivity.java <<'EOF'

          package com.boyoshisab.app;


          import android.app.Activity;

          import android.os.Bundle;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;


          import com.google.android.gms.ads.AdError;

          import com.google.android.gms.ads.AdRequest;

          import com.google.android.gms.ads.AdView;

          import com.google.android.gms.ads.FullScreenContentCallback;

          import com.google.android.gms.ads.LoadAdError;

          import com.google.android.gms.ads.MobileAds;

          import com.google.android.gms.ads.interstitial.InterstitialAd;

          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;


          public class MainActivity extends Activity {


              private WebView webView;

              private AdView adView;

              private InterstitialAd mInterstitialAd;


              private boolean firstPageLoaded = false;


              private long lastInterstitialTime = 0;


              private static final long
                      INTERSTITIAL_COOLDOWN = 60000;


              @Override

              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  setContentView(
                      R.layout.activity_main
                  );


                  // =====================================
                  // Initialize AdMob
                  // =====================================


                  MobileAds.initialize(

                      this,

                      initializationStatus -> {}

                  );


                  // =====================================
                  // WebView
                  // =====================================


                  webView =
                      findViewById(R.id.webView);


                  WebSettings settings =
                      webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);


                  webView.setWebViewClient(
                      new WebViewClient() {


                          @Override

                          public void onPageFinished(

                              WebView view,

                              String url) {


                              super.onPageFinished(
                                  view,
                                  url
                              );


                              if (firstPageLoaded) {

                                  showInterstitialIfReady();

                              } else {

                                  firstPageLoaded = true;

                              }

                          }

                      }
                  );


                  // =====================================
                  // Load Website
                  // =====================================


                  webView.loadUrl(

                      "file:///android_asset/index.html"

                  );


                  // =====================================
                  // Banner Ad
                  // =====================================


                  adView =
                      findViewById(R.id.adView);


                  AdRequest bannerRequest =
                      new AdRequest.Builder().build();


                  adView.loadAd(
                      bannerRequest
                  );


                  // =====================================
                  // Load Interstitial
                  // =====================================


                  loadInterstitialAd();

              }


              // ==========================================
              // Load Interstitial Ad
              // ==========================================


              private void loadInterstitialAd() {


                  AdRequest adRequest =
                      new AdRequest.Builder().build();


                  InterstitialAd.load(

                      this,

                      "ca-app-pub-4629127200038980/5484192700",

                      adRequest,


                      new InterstitialAdLoadCallback() {


                          @Override

                          public void onAdLoaded(

                              InterstitialAd interstitialAd) {


                              mInterstitialAd =
                                  interstitialAd;


                              setupInterstitialCallbacks();

                          }


                          @Override

                          public void onAdFailedToLoad(

                              LoadAdError adError) {


                              mInterstitialAd = null;

                          }

                      }

                  );

              }


              // ==========================================
              // Interstitial Callbacks
              // ==========================================


              private void setupInterstitialCallbacks() {


                  if (mInterstitialAd == null) {

                      return;

                  }


                  mInterstitialAd.setFullScreenContentCallback(

                      new FullScreenContentCallback() {


                          @Override

                          public void onAdDismissedFullScreenContent() {


                              mInterstitialAd = null;


                              loadInterstitialAd();

                          }


                          @Override

                          public void onAdFailedToShowFullScreenContent(

                              AdError adError) {


                              mInterstitialAd = null;


                              loadInterstitialAd();

                          }

                      }

                  );

              }


              // ==========================================
              // Show Interstitial
              // ==========================================


              private void showInterstitialIfReady() {


                  long currentTime =
                      System.currentTimeMillis();


                  if (

                      currentTime -
                      lastInterstitialTime
                      < INTERSTITIAL_COOLDOWN

                  ) {

                      return;

                  }


                  if (mInterstitialAd != null) {


                      lastInterstitialTime =
                          currentTime;


                      mInterstitialAd.show(this);

                  }

              }


              // ==========================================
              // Android Back Button
              // ==========================================


              @Override

              public void onBackPressed() {


                  if (

                      webView != null
                      &&
                      webView.canGoBack()

                  ) {


                      webView.goBack();


                  } else {


                      super.onBackPressed();

                  }

              }


              // ==========================================
              // Pause
              // ==========================================


              @Override

              protected void onPause() {


                  if (adView != null) {

                      adView.pause();

                  }


                  super.onPause();

              }


              // ==========================================
              // Resume
              // ==========================================


              @Override

              protected void onResume() {


                  super.onResume();


                  if (adView != null) {

                      adView.resume();

                  }

              }


              // ==========================================
              // Destroy
              // ==========================================


              @Override

              protected void onDestroy() {


                  if (adView != null) {

                      adView.destroy();

                  }


                  if (webView != null) {

                      webView.destroy();

                  }


                  super.onDestroy();

              }

          }

          EOF


      # ==========================================
      # 15. Copy App Logo
      # ==========================================

      - name: Copy App Logo

        run: |

          set -e


          if [ ! -f "icon.png" ]; then

            echo "ERROR: icon.png not found!"

            exit 1

          fi


          cp icon.png \
            BoyosHisab/app/src/main/res/drawable/app_icon.png


          cp icon.png \
            BoyosHisab/app/src/main/assets/i
