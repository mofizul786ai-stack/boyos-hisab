name: Build Boyos Hisab Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # 4. INSTALL ANDROID SDK
      # ==================================================

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==================================================
      # 5. CREATE ANDROID PROJECT
      # ==================================================

      - name: Create Android Project
        run: |
          set -e

          rm -rf BoyosHisab

          mkdir -p BoyosHisab/app/src/main/java/com/boyoshisab/app
          mkdir -p BoyosHisab/app/src/main/res/layout
          mkdir -p BoyosHisab/app/src/main/res/values
          mkdir -p BoyosHisab/app/src/main/res/drawable
          mkdir -p BoyosHisab/app/src/main/assets


      # ==================================================
      # 6. RESTORE SIGNING KEY
      # ==================================================

      - name: Restore Signing Key
        working-directory: BoyosHisab
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          echo "Checking KEYSTORE_BASE64..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty!"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is empty!"
            exit 1
          fi

          CLEAN_KEYSTORE=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')

          if [ -z "$CLEAN_KEYSTORE" ]; then
            echo "ERROR: Cleaned keystore value is empty!"
            exit 1
          fi

          echo "Restoring release.keystore..."

          printf '%s' "$CLEAN_KEYSTORE" \
            | base64 --decode --ignore-garbage \
            > release.keystore

          if [ ! -s release.keystore ]; then
            echo "ERROR: release.keystore was not created!"
            exit 1
          fi

          echo "Checking keystore..."

          keytool \
            -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null 2>&1

          echo "Signing key restored successfully."

          ls -lh release.keystore


      # ==================================================
      # 7. GRADLE PROPERTIES
      # ==================================================

      - name: Create Gradle Properties
        working-directory: BoyosHisab
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF


      # ==================================================
      # 8. GRADLE SETTINGS
      # ==================================================

      - name: Create Gradle Settings
        working-directory: BoyosHisab
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BoyosHisab"

          include(":app")
          EOF


      # ==================================================
      # 9. ROOT GRADLE
      # ==================================================

      - name: Create Root Gradle
        working-directory: BoyosHisab
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # ==================================================
      # 10. APP GRADLE
      # ==================================================

      - name: Create App Gradle
        working-directory: BoyosHisab
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.boyoshisab.app'

              compileSdk 35

              defaultConfig {
                  applicationId "com.boyoshisab.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:24.5.0'
          }
          EOF


      # ==================================================
      # 11. ANDROID MANIFEST
      # ==================================================

      - name: Create Android Manifest
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="বয়স হিসাব"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <!-- ADMOB APP ID -->

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-4629127200038980~5718715166" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==================================================
      # 12. APP THEME
      # ==================================================

      - name: Create App Theme
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#2196F3</item>

                  <item name="android:statusBarColor">#1565C0</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # ==================================================
      # 13. MAIN LAYOUT
      # ==================================================

      - name: Create Main Layout
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:ads="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#FFFFFF">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:overScrollMode="never" />

              <!-- ADMOB BANNER -->

              <com.google.android.gms.ads.AdView
                  android:id="@+id/adView"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  ads:adSize="BANNER"
                  ads:adUnitId="ca-app-pub-4629127200038980/4349793174" />

          </LinearLayout>
          EOF


      # ==================================================
      # 14. MAIN ACTIVITY
      # ==================================================

      - name: Create MainActivity
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/java/com/boyoshisab/app/MainActivity.java <<'EOF'
          package com.boyoshisab.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;

          public class MainActivity extends Activity {

              private WebView webView;
              private AdView adView;
              private InterstitialAd interstitialAd;

              private static final String INTERSTITIAL_ID =
                      "ca-app-pub-4629127200038980/5484192700";

              private final Handler handler = new Handler();

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  // =====================================
                  // ADMOB INITIALIZE
                  // =====================================

                  MobileAds.initialize(
                          this,
                          initializationStatus -> {}
                  );

                  // =====================================
                  // WEBVIEW
                  // =====================================

                  webView = findViewById(R.id.webView);

                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(
                          new WebViewClient()
                  );

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );

                  // =====================================
                  // BANNER AD
                  // =====================================

                  adView = findViewById(R.id.adView);

                  AdRequest bannerRequest =
                          new AdRequest.Builder().build();

                  adView.loadAd(bannerRequest);

                  // =====================================
                  // LOAD INTERSTITIAL
                  // =====================================

                  loadInterstitial();

                  // =====================================
                  // SHOW AFTER 30 SECONDS
                  // =====================================

                  handler.postDelayed(
                          () -> showInterstitial(),
                          30000
                  );
              }


              // =====================================
              // LOAD INTERSTITIAL
              // =====================================

              private void loadInterstitial() {

                  AdRequest request =
                          new AdRequest.Builder().build();

                  InterstitialAd.load(
                          this,
                          INTERSTITIAL_ID,
                          request,
                          new InterstitialAdLoadCallback() {

                              @Override
                              public void onAdLoaded(
                                      InterstitialAd ad) {

                                  interstitialAd = ad;
                              }

                              @Override
                              public void onAdFailedToLoad(
                                      LoadAdError adError) {

                                  interstitialAd = null;
                              }
                          }
                  );
              }


              // =====================================
              // SHOW INTERSTITIAL
              // =====================================

              private void showInterstitial() {

                  if (interstitialAd != null) {

                      interstitialAd.show(this);

                      interstitialAd = null;

                      loadInterstitial();
                  }
              }


              // =====================================
              // BACK BUTTON
              // =====================================

              @Override
              public void onBackPressed() {

                  if (webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              // =====================================
              // PAUSE
              // =====================================

              @Override
              protected void onPause() {

                  if (adView != null) {
                      adView.pause();
                  }

                  super.onPause();
              }


              // =====================================
              // RESUME
              // =====================================

              @Override
              protected void onResume() {

                  super.onResume();

                  if (adView != null) {
                      adView.resume();
                  }
              }


              // =====================================
              // DESTROY
              // =====================================

              @Override
              protected void onDestroy() {

                  handler.removeCallbacksAndMessages(null);

                  if (adView != null) {
                      adView.destroy();
                  }

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF


      # ==================================================
      # 15. COPY APP LOGO
      # ==================================================

      - name: Copy App Logo
        run: |
          set -e

          if [ ! -f "icon.png" ]; then
            echo "ERROR: icon.png not found!"
            exit 1
          fi

          cp icon.png \
            BoyosHisab/app/src/main/res/drawable/app_icon.png

          cp icon.png \
            BoyosHisab/app/src/main/assets/icon.png

          echo "App logo copied."


      # ==================================================
      # 16. COPY INDEX.HTML
      # ==================================================

      - name: Copy index.html
        run: |
          set -e

          if [ ! -f "index.html" ];        
