name: Build Release APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android Project
        run: |
          mkdir -p android/app/src/main/java/com/boyoshisab/app
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

      - name: Create Root Gradle
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create Settings
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BoyosHisab"
          include ':app'
          EOF

      - name: Create Gradle Properties
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

      - name: Create App Gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.boyoshisab.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.boyoshisab.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("${rootProject.projectDir}/release-key.jks")
                      storePassword "BoyosHisab2026"
                      keyAlias "boyoshisab"
                      keyPassword "BoyosHisab2026"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
          }
          EOF

      - name: Create Manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="বয়স হিসাব"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/icon">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create Theme
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#1565C0</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/boyoshisab/app/MainActivity.java <<'EOF'
          package com.boyoshisab.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Copy Website Files
        run: |
          if [ -f index.html ]; then
            cp index.html android/app/src/main/assets/
          fi

          if [ -f style.css ]; then
            cp style.css android/app/src/main/assets/
          fi

          if [ -f script.js ]; then
            cp script.js android/app/src/main/assets/
          fi

          if [ -f birthday.html ]; then
            cp birthday.html android/app/src/main/assets/
          fi

          if [ -f rashi.html ]; then
            cp rashi.html android/app/src/main/assets/
          fi

          if [ -f more.html ]; then
            cp more.html android/app/src/main/assets/
          fi

          if [ -f manifest.json ]; then
            cp manifest.json android/app/src/main/assets/
          fi

          if [ -f service-worker.js ]; then
            cp service-worker.js android/app/src/main/assets/
          fi

          if [ -f sw.js ]; then
            cp sw.js android/app/src/main/assets/
          fi

      - name: Copy App Logo
        run: |
          if [ -f icon.png ]; then
            cp icon.png android/app/src/main/res/drawable/icon.png
          else
            echo "icon.png not found"
          fi

      - name: Create Signing Key
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/release-key.jks \
            -storetype JKS \
            -storepass "BoyosHisab2026" \
            -keypass "BoyosHisab2026" \
            -alias "boyoshisab" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Boyos Hisab, OU=App, O=Boyos Hisab, L=Guwahati, ST=Assam, C=IN"

      - name: Check Signing Key
        run: |
          test -f android/release-key.jks

          keytool -list \
            -keystore android/release-key.jks \
            -storepass "BoyosHisab2026" \
            -alias "boyoshisab"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew clean assembleRelease

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare Release Files
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/release/app-release.apk \
             release/Boyos-Hisab-Release.apk

          cp android/app/build/outputs/bundle/release/app-release.aab \
             release/Boyos-Hisab-Release.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Boyos-Hisab-Release
          path: release/
          if-no-files-found: error
