name: Build Release APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # STEP 1 - CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # STEP 2 - JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # STEP 3 - ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # STEP 4 - INSTALL ANDROID SDK
      # =========================================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"


      # =========================================================
      # STEP 5 - CREATE ANDROID PROJECT
      # =========================================================
      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf android
          mkdir -p android/app/src/main/java/com/boyoshisab/app
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/assets


      # =========================================================
      # STEP 6 - ROOT GRADLE
      # =========================================================
      - name: Create Root Gradle
        shell: bash
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # =========================================================
      # STEP 7 - SETTINGS GRADLE
      # =========================================================
      - name: Create Gradle Settings
        shell: bash
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BoyosHisab"
          include ':app'
          EOF


      # =========================================================
      # STEP 8 - GRADLE PROPERTIES
      # =========================================================
      - name: Create Gradle Properties
        shell: bash
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # =========================================================
      # STEP 9 - APP GRADLE
      # =========================================================
      - name: Create App Gradle
        shell: bash
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.boyoshisab.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.boyoshisab.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("${rootProject.projectDir}/release-key.jks")
                      storePassword "BoyosHisab2026"
                      keyAlias "boyoshisab"
                      keyPassword "BoyosHisab2026"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF


      # =========================================================
      # STEP 10 - ANDROID MANIFEST
      # =========================================================
      - name: Create Android Manifest
        shell: bash
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="বয়স হিসাব"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # STEP 11 - APP THEME
      # =========================================================
      - name: Create App Theme
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#1565C0</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#1976D2</item>

              </style>

          </resources>
          EOF


      # =========================================================
      # STEP 12 - MAIN ACTIVITY
      # =========================================================
      - name: Create MainActivity
        shell: bash
        run: |
          cat > android/app/src/main/java/com/boyoshisab/app/MainActivity.java <<'EOF'
          package com.boyoshisab.app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF


      # =========================================================
      # STEP 13 - COPY INDEX.HTML
      # =========================================================
      - name: Copy index.html
        shell: bash
        run: |
          set -e

          if [ -f "index.html" ]; then
            cp "index.html" "android/app/src/main/assets/index.html"
          else
            cat > android/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="bn">

          <head>
              <meta charset="UTF-8">
              <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0">
              <title>বয়স হিসাব</title>

              <style>
                  * {
                      box-sizing: border-box;
                  }

                  body {
                      margin: 0;
                      font-family: Arial, sans-serif;
                      background: #f4f8ff;
                      color: #222;
                  }

                  .header {
                      background: linear-gradient(135deg, #1976d2, #42a5f5);
                      color: white;
                      padding: 28px 20px;
                      text-align: center;
                  }

                  .header h1 {
                      margin: 0;
                      font-size: 28px;
                  }

                  .container {
                      padding: 20px;
                  }

                  .card {
                      background: white;
                      border-radius: 20px;
                      padding: 20px;
                      margin-bottom: 18px;
                      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
                  }

                  label {
                      display: block;
                      margin-bottom: 10px;
                      font-weight: bold;
                  }

                  input {
                      width: 100%;
                      padding: 14px;
                      border: 1px solid #ddd;
                      border-radius: 12px;
                      font-size: 16px;
                  }

                  button {
                      width: 100%;
                      padding: 15px;
                      margin-top: 15px;
                      border: none;
                      border-radius: 12px;
                      background: #1976d2;
                      color: white;
                      font-size: 17px;
                      font-weight: bold;
                  }

                  .result {
                      text-align: center;
                      font-size: 22px;
                      color: #1976d2;
                      font-weight: bold;
                  }
              </style>
          </head>

          <body>

              <div class="header">
                  <h1>🎂 বয়স হিসাব</h1>
                  <p>আপনার সঠিক বয়স জানুন</p>
              </div>

              <div class="container">

                  <div class="card">

                      <label>জন্ম তারিখ</label>

                      <input
                          type="date"
                          id="birthDate">

                      <button onclick="calculateAge()">
                          বয়স হিসাব করুন
                      </button>

                  </div>

                  <div class="card">

                      <div
                          id="result"
                          class="result">
                          জন্ম তারিখ দিন
                      </div>

                  </div>

              </div>

              <script>

                  function calculateAge() {

                      const value =
                          document.getElementById("birthDate").value;

                      if (!value) {
                          document.getElementById("result").innerText =
                              "জন্ম তারিখ নির্বাচন করুন";
                          return;
                      }

                      const birth =
                          new Date(value);

                      const today =
                          new Date();

                      let years =
                          today.getFullYear() -
                          birth.getFullYear();

                      let months =
                          today.getMonth() -
                          birth.getMonth();

                      let days =
                          today.getDate() -
                          birth.getDate();

                      if (days < 0) {
                          months--;
                          days += new Date(
                              today.getFullYear(),
                              today.getMonth(),
                              0
                          ).getDate();
                      }

                      if (months < 0) {
                          years--;
                          months += 12;
                      }

                      document.getElementById("result").innerText =
                          years + " বছর " +
                          months + " মাস " +
                          days + " দিন";

                  }

              </script>

          </body>
          </html>
          EOF
          fi


      # =========================================================
      # STEP 14 - COPY OTHER WEB FILES
      # =========================================================
      - name: Copy Web Assets
        shell: bash
        run: |
          set -e

          for file in style.css script.js birthday.html rashi.html more.html manifest.json sw.js; do
            if [ -f "$file" ]; then
              cp "$file" "android/app/src/main/assets/$file"
            fi
          done


      # =========================================================
      # STEP 15 - COPY LOGO IF EXISTS
      # =========================================================
      - name: Copy App Logo
        shell: bash
        run: |
          set -e

          if [ -f "logo.png" ]; then
            cp "logo.png" \
              "android/app/src/main/res/drawable/app_logo.png"
          fi


      # =========================================================
      # STEP 16 - CREATE RELEASE SIGNING KEY
      # =========================================================
      # IMPORTANT:
      # No GitHub Secret is needed.
      # No base64 key is needed.
      # This completely avoids the previous EOFException.
      # =========================================================
      - name: Create Release Signing Key
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore android/release-key.jks \
            -storetype JKS \
            -storepass "BoyosHisab2026" \
            -keypass "BoyosHisab2026" \
            -alias "boyoshisab" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Boyos Hisab, OU=App, O=Boyos Hisab, L=Guwahati, ST=Assam, C=IN"


      # =========================================================
      # STEP 17 - CHECK SIGNING KEY
      # =========================================================
      - name: Check Signing Key
        shell: bash
        run: |
          set -e

          test -f android/release-key.jks

          keytool -list \
            -keystore android/release-key.jks \
            -storepass "BoyosHisab2026" \
            -alias "boyoshisab"


      # =========================================================
      # STEP 18 - DOWNLOAD GRADLE
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # =========================================================
      # STEP 19 - CREATE GRADLE WRAPPER
      # =========================================================
      - name: Create Gradle Wrapper
        shell: bash
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9


      # =========================================================
      # STEP 20 - BUILD RELEASE APK
      # =========================================================
      - name: Build Release APK
        shell: bash
        working-directory: android
        run: |
          ./gradlew clean assembleRelease --stacktrace


      # =========================================================
      # STEP 21 - BUILD RELEASE AAB
      # =========================================================
      - name: Build Release AAB
        shell: bash
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace


      # =========================================================
      # STEP 22 - VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f android/app/build/outputs/apk/release/app-release.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk


      # =========================================================
      # STEP 23 - VERIFY AAB
      # =========================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          test -f android/app/build/outputs/bundle/release/app-release.aab


      # =========================================================
      # STEP 24 - RENAME RELEASE FILES
      # =========================================================
      - name: Rename Release Files
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/Boyos-Hisab-Release.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/Boyos-Hisab-Release.aab


      # =========================================================
      # STEP 25 - SHOW FILES
      # =========================================================
      - name: Show Release Files
        shell: bash
        run: |
          ls -lh release/


      # =========================================================
      # STEP 26 - UPLOAD APK AND AAB
      # =========================================================
      - name: Upload Release APK and AAB
      uses: actions/upload-artifact@v4
        with:
          name: Boyos-Hisab-Release
          path: release/
          if-no-files-found: error


      # =========================================================
      # STEP 27 - COMPLETE
      # =========================================================
      - name: Build Complete
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "APK: release/Boyos-Hisab-Release.apk"
          echo "AAB: release/Boyos-Hisab-Release.aab"
          echo "========================================"
