name: Build Boyos Hisab APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 4. Install Android SDK
      # ==========================================
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 5. Create Android Project
      # ==========================================
      - name: Create Android Project
        run: |
          set -e

          rm -rf BoyosHisab

          mkdir -p BoyosHisab/app/src/main/java/com/boyoshisab/app
          mkdir -p BoyosHisab/app/src/main/res/layout
          mkdir -p BoyosHisab/app/src/main/res/values
          mkdir -p BoyosHisab/app/src/main/res/drawable
          mkdir -p BoyosHisab/app/src/main/assets


      # ==========================================
      # 6. Gradle Properties
      # ==========================================
      - name: Create Gradle Properties
        working-directory: BoyosHisab
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF


      # ==========================================
      # 7. Settings Gradle
      # ==========================================
      - name: Create Settings Gradle
        working-directory: BoyosHisab
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BoyosHisab"

          include(":app")
          EOF


      # ==========================================
      # 8. Root Build Gradle
      # ==========================================
      - name: Create Root Build Gradle
        working-directory: BoyosHisab
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # ==========================================
      # 9. App Build Gradle
      # ==========================================
      - name: Create App Build Gradle
        working-directory: BoyosHisab
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.boyoshisab.app'

              compileSdk 35

              defaultConfig {

                  applicationId "com.boyoshisab.app"

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"
              }


              signingConfigs {

                  release {

                      storeFile file("${rootProject.projectDir}/boyos-hisab-release.jks")

                      storePassword "BoyosHisab2026"

                      keyAlias "boyoshisab"

                      keyPassword "BoyosHisab2026"
                  }
              }


              buildTypes {

                  debug {

                      minifyEnabled false
                  }


                  release {

                      minifyEnabled false

                      shrinkResources false

                      signingConfig signingConfigs.release
                  }
              }
          }


          dependencies {

              implementation 'com.google.android.gms:play-services-ads:24.5.0'
          }
          EOF


      # ==========================================
      # 10. Create Release Keystore
      # ==========================================
      - name: Create Release Keystore
        working-directory: BoyosHisab
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore boyos-hisab-release.jks \
            -alias boyoshisab \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass BoyosHisab2026 \
            -keypass BoyosHisab2026 \
            -dname "CN=Boyos Hisab, OU=App, O=Boyos Hisab, L=Guwahati, ST=Assam, C=IN"

          echo "Release keystore created successfully."


      # ==========================================
      # 11. Android Manifest
      # ==========================================
      - name: Create Android Manifest
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <!-- Internet -->
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />


              <application

                  android:allowBackup="true"

                  android:icon="@drawable/icon"

                  android:label="বয়স হিসাব"

                  android:supportsRtl="true"

                  android:hardwareAccelerated="true"

                  android:theme="@style/AppTheme">


                  <!-- ================================= -->
                  <!-- YOUR ADMOB APP ID -->
                  <!-- ================================= -->

                  <meta-data

                      android:name="com.google.android.gms.ads.APPLICATION_ID"

                      android:value="ca-app-pub-4629127200038980~5718715166" />


                  <!-- ================================= -->
                  <!-- Main Activity -->
                  <!-- ================================= -->

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


              </application>

          </manifest>
          EOF


      # ==========================================
      # 12. App Theme
      # ==========================================
      - name: Create App Theme
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #2196F3
                  </item>

                  <item name="android:statusBarColor">
                      #1565C0
                  </item>

                  <item name="android:navigationBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

              </style>

          </resources>
          EOF


      # ==========================================
      # 13. Main Layout
      # ==========================================
      - name: Create Main Layout
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout

              xmlns:android="http://schemas.android.com/apk/res/android"

              xmlns:ads="http://schemas.android.com/apk/res-auto"

              android:layout_width="match_parent"

              android:layout_height="match_parent"

              android:orientation="vertical">


              <!-- Website -->

              <WebView

                  android:id="@+id/webView"

                  android:layout_width="match_parent"

                  android:layout_height="0dp"

                  android:layout_weight="1" />


              <!-- ================================= -->
              <!-- YOUR ADMOB BANNER -->
              <!-- ================================= -->

              <com.google.android.gms.ads.AdView

                  android:id="@+id/adView"

                  android:layout_width="match_parent"

                  android:layout_height="wrap_content"

                  ads:adSize="BANNER"

                  ads:adUnitId="ca-app-pub-4629127200038980/4349793174" />


          </LinearLayout>
          EOF


      # ==========================================
      # 14. Main Activity
      # ==========================================
      - name: Create MainActivity
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/java/com/boyoshisab/app/MainActivity.java <<'EOF'
          package com.boyoshisab.app;


          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;


          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;


          public class MainActivity extends Activity {


              private WebView webView;

              private AdView adView;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  setContentView(R.layout.activity_main);


                  // =====================================
                  // Initialize AdMob
                  // =====================================

                  MobileAds.initialize(
                      this,
                      initializationStatus -> {}
                  );


                  // =====================================
                  // WebView
                  // =====================================

                  webView =
                      findViewById(R.id.webView);


                  WebSettings settings =
                      webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setLoadsImagesAutomatically(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);


                  webView.setWebViewClient(
                      new WebViewClient()
                  );


                  // =====================================
                  // Load Website
                  // =====================================

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );


                  // =====================================
                  // Banner Ad
                  // =====================================

                  adView =
                      findViewById(R.id.adView);


                  AdRequest adRequest =
                      new AdRequest.Builder()
                          .build();


                  adView.loadAd(adRequest);
              }


              // =====================================
              // Back Button
              // =====================================

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              // =====================================
              // Pause
              // =====================================

              @Override
              protected void onPause() {

                  if (adView != null) {

                      adView.pause();
                  }

                  super.onPause();
              }


              // =====================================
              // Resume
              // =====================================

              @Override
              protected void onResume() {

                  super.onResume();


                  if (adView != null) {

                      adView.resume();
                  }
              }


              // =====================================
              // Destroy
              // =====================================

              @Override
              protected void onDestroy() {

                  if (adView != null) {

                      adView.destroy();
                  }


                  if (webView != null) {

                      webView.destroy();
                  }


                  super.onDestroy();
              }
          }
          EOF


      # ==========================================
      # 15. Copy Website Files
      # ==========================================
      - name: Copy Website Files
        run: |
          set -e

          echo "Copying website files..."


          # ======================================
          # Main index.html
          # ======================================

          if [ -f "index.html" ]; then

              cp index.html \
                BoyosHisab/app/src/main/assets/index.html

          else

              echo "ERROR: index.html not found!"

              exit 1

          fi


          # ======================================
          # HTML Pages
          # ======================================

          for file in \
              birthday.html \
              rashi.html \
              more.html; do

              if [ -f "$file" ]; then

                  cp "$file" \
                    BoyosHisab/app/src/main/assets/

              fi

          done


          # ======================================
          # CSS
          # ======================================

          if [ -f "style.css" ]; then

              cp style.css \
                BoyosHisab/app/src/main/assets/

          fi


          # ======================================
          # JavaScript
          # ======================================

          if [ -f "script.js" ]; then

              cp script.js \
                BoyosHisab/app/src/main/assets/

          fi


          # ======================================
          # Service Worker
          # ======================================

          if [ -f "service-worker.js" ]; then

              cp service-worker.js \
                BoyosHisab/app/src/main/assets/

          fi


          # ======================================
          # Manifest
          # ======================================

          if [ -f "manifest.json" ]; then

              cp manifest.json \
                BoyosHisab/app/src/main/assets/

          fi


          # ======================================
          # App Icon
          # ======================================

          if [ -f "icon.png" ]; then

              cp icon.png \
                BoyosHisab/app/src/main/res/drawable/icon.png

              cp icon.png \
                BoyosHisab/app/src/main/assets/icon.png

          else

              echo "ERROR: icon.png not found!"

              exit 1

          fi


          # ======================================
          # Folders
          # ======================================

          for folder in \
              css \
              js \
              images \
              img \
              fonts \
              assets; do

              if [ -d "$folder" ]; then

                  cp -r "$folder" \
                    BoyosHisab/app/src/main/assets/

              fi

          done


          echo "Website files copied successfully."


      # ==========================================
      # 16. Create Gradle Wrapper
      # ==========================================
      - name: Create Gradle Wrapper
        working-directory: BoyosHisab
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.10.2

          chmod +x gradlew


      # ==========================================
      # 17. Check Project
      # ==========================================
      - name: Check Gradle Project
        working-directory: BoyosHisab
        run: |
          ./gradlew --version

          ./gradlew tasks


      # ==========================================
      # 18. Build Release APK
      # ==========================================
      - name: Build Release APK
        working-directory: BoyosHisab
        run: |
          set -e

          ./gradlew \
            assembleRelease \
            --stacktrace \
            --no-daemon


      # ==========================================
      # 19. Build Release AAB
      # ==========================================
      - name: Build Release AAB
        working-directory: BoyosHisab
        run: |
          set -e

          ./gradlew \
            bundleRelease \
            --stacktrace \
            --no-daemon


      # ==========================================
      # 20. Find Build Files
      # ==========================================
      - name: Find Build Files
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find BoyosHisab/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


          echo "======================================"
          echo "AAB FILES"
          echo "======================================"

          find BoyosHisab/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print


      # ==========================================
      # 21. Prepare APK and AAB
      # ==========================================
      - name: Prepare APK and AAB
        run: |
          set -e

          mkdir -p output


        
