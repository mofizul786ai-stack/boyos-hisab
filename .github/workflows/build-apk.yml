name: Build Boyos Hisab

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/mofizul786ai/boyoshisab
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          if [ ! -f "icon.png" ]; then
            echo "ERROR: icon.png not found in repository root!"
            exit 1
          fi

          cp icon.png app/src/main/res/drawable/app_icon.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BoyosHisab"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mofizul786ai.boyoshisab'
              compileSdk 35

              defaultConfig {
                  applicationId "com.mofizul786ai.boyoshisab"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2563EB</item>
                  <item name="android:statusBarColor">#2563EB</item>
                  <item name="android:navigationBarColor">#F3F7FF</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="বয়স হিসাব"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/mofizul786ai/boyoshisab/MainActivity.java <<'EOF'
          package com.mofizul786ai.boyoshisab;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient()
                  );

                  webView.loadUrl(
                      "https://mofizul786ai-stack.github.io/boyos-hisab/"
                  );
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Boyos-Hisab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boyos-Hisab-APK
          path: release/Boyos-Hisab.apk
          if-no-files-found: error

      - name: Build Release AAB
        run: |
          gradle bundleRelease --stacktrace

      - name: Prepare AAB
        run: |
          mkdir -p release
          cp app/build/outputs/bundle/release/app-release.aab release/Boyos-Hisab.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Boyos-Hisab-AAB
          path: release/Boyos-Hisab.aab
          if-no-files-found: error
