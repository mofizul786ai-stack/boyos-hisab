name: Build Boyos Hisab Release APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # 4. Android SDK packages
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # 5. Create Android project
      - name: Create Android Project
        run: |
          set -e

          rm -rf BoyosHisab

          mkdir -p BoyosHisab/app/src/main/java/com/boyoshisab/app
          mkdir -p BoyosHisab/app/src/main/res/layout
          mkdir -p BoyosHisab/app/src/main/res/values
          mkdir -p BoyosHisab/app/src/main/res/drawable
          mkdir -p BoyosHisab/app/src/main/assets


      # 6. AndroidX
      - name: Enable AndroidX
        working-directory: BoyosHisab
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF


      # 7. settings.gradle
      - name: Create Settings
        working-directory: BoyosHisab
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BoyosHisab"
          include(":app")
          EOF


      # 8. Root build.gradle
      - name: Create Root Gradle
        working-directory: BoyosHisab
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # 9. App build.gradle
      - name: Create App Gradle
        working-directory: BoyosHisab
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.boyoshisab.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.boyoshisab.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false

                      // Release APK install করার জন্য debug signing
                      // Play Store-এর জন্য পরে নিজের upload key লাগবে
                      signingConfig signingConfigs.debug
                  }
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:24.5.0'
          }
          EOF


      # 10. AndroidManifest.xml
      - name: Create Manifest
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="বয়স হিসাব"
                  android:icon="@drawable/icon"
                  android:roundIcon="@drawable/icon"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <!-- নিজের AdMob App ID -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-4629127200038980~5718715166"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # 11. App Theme
      - name: Create Theme
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>

                  <item name="android:statusBarColor">#1565C0</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # 12. Main Layout
      - name: Create Main Layout
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:ads="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#FFFFFF">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"/>

              <com.google.android.gms.ads.AdView
                  android:id="@+id/adView"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  ads:adSize="BANNER"
                  ads:adUnitId="ca-app-pub-4629127200038980/4349793174"/>

          </LinearLayout>
          EOF


      # 13. MainActivity.java
      - name: Create MainActivity
        working-directory: BoyosHisab
        run: |
          cat > app/src/main/java/com/boyoshisab/app/MainActivity.java <<'EOF'
          package com.boyoshisab.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;

          public class MainActivity extends Activity {

              private WebView webView;
              private AdView adView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  // AdMob initialize
                  MobileAds.initialize(this, initializationStatus -> {});

                  // WebView
                  webView = findViewById(R.id.webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  // Banner Ad
                  adView = findViewById(R.id.adView);

                  AdRequest adRequest = new AdRequest.Builder().build();

                  adView.loadAd(adRequest);
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {

                  if (adView != null) {
                      adView.pause();
                  }

                  super.onPause();
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (adView != null) {
                      adView.resume();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (adView != null) {
                      adView.destroy();
                  }

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF


      # 14. Copy website files
      - name: Copy Website Files
        run: |
          set -e

          # Main page
          if [ -f "index.html" ]; then
            cp index.html BoyosHisab/app/src/main/assets/
          fi

          # Other pages
          for file in birthday.html rashi.html more.html; do
            if [ -f "$file" ]; then
              cp "$file" BoyosHisab/app/src/main/assets/
            fi
          done

          # JavaScript / CSS / images folders
          for folder in css js images assets img fonts; do
            if [ -d "$folder" ]; then
              cp -r "$folder" BoyosHisab/app/src/main/assets/
            fi
          done


      # 15. Copy App Icon
      - name: Copy App Icon
        run: |
          if [ -f "icon.png" ]; then
            cp icon.png BoyosHisab/app/src/main/res/drawable/icon.png
          else
            echo "icon.png not found"
          fi


      # 16. Check important files
      - name: Check Project
        run: |
          echo "========== PROJECT FILES =========="
          find BoyosHisab -maxdepth 5 -type f | sort

          echo "========== WEBSITE FILES =========="
          ls -la BoyosHisab/app/src/main/assets/ || true


      # 17. Gradle Wrapper
      - name: Prepare Gradle
        working-directory: BoyosHisab
        run: |
          gradle wrapper --gradle-version 8.10.2


      # 18. Build Release APK
      - name: Build Release APK
        working-directory: BoyosHisab
        run: |
          set -e
          ./gradlew clean
          ./gradlew assembleRelease --stacktrace


      # 19. Build Release AAB
      - name: Build Release AAB
        working-directory: BoyosHisab
        run: |
          set -e
          ./gradlew bundleRelease --stacktrace


      # 20. Prepare output
      - name: Prepare Release Files
        run: |
          set -e

          mkdir -p output

          cp BoyosHisab/app/build/outputs/apk/release/app-release.apk \
             output/Boyos-Hisab-Release-APK.apk

          cp BoyosHisab/app/build/outputs/bundle/release/app-release.aab \
             output/Boyos-Hisab-Release-AAB.aab

          echo "========== OUTPUT =========="
          ls -lh output/


      # 21. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Boyos-Hisab-Release-APK
          path: output/Boyos-Hisab-Release-APK.apk


      # 22. Upload Release AAB
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Boyos-Hisab-Release-AAB
          path: output/Boyos-Hisab-Release-AAB.aab
