name: Build Release APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android Project
        run: |
          mkdir -p android/app/src/main/java/com/boyoshisab/app
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

      - name: Create Root Gradle
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create Settings
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BoyosHisab"
          include ':app'
          EOF

      - name: Create Gradle Properties
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create App Gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.boyoshisab.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.boyoshisab.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("${rootProject.projectDir}/release-key.jks")
                      storePassword "BoyosHisab2026"
                      keyAlias "boyoshisab"
                      keyPassword "BoyosHisab2026"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      - name: Create Manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="বয়স হিসাব"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create Theme
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#1565C0</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/boyoshisab/app/MainActivity.java <<'EOF'
          package com.boyoshisab.app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Copy index.html
        run: |
          if [ -f index.html ]; then
            cp index.html android/app/src/main/assets/index.html
          else
            cat > android/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="bn">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width,initial-scale=1.0">
              <title>বয়স হিসাব</title>
              <style>
                  body {
                      margin: 0;
                      font-family: Arial, sans-serif;
                      background: #f4f8ff;
                  }
                  .header {
                      background: linear-gradient(135deg,#1976d2,#42a5f5);
                      color: white;
                      padding: 30px 20px;
                      text-align: center;
                  }
                  .container {
                      padding: 20px;
                  }
                  .card {
                      background: white;
                      padding: 20px;
                      border-radius: 20px;
                      margin-bottom: 20px;
                      box-shadow: 0 5px 20px rgba(0,0,0,.08);
                  }
                  input,button {
                      width: 100%;
                      padding: 15px;
                      box-sizing: border-box;
                      margin-top: 10px;
                      border-radius: 12px;
                      font-size: 16px;
                  }
                  input {
                      border: 1px solid #ddd;
                  }
                  button {
                      border: 0;
                      background: #1976d2;
                      color: white;
                      font-weight: bold;
                  }
                  #result {
                      text-align: center;
                      color: #1976d2;
                      font-size: 22px;
                      font-weight: bold;
                  }
              </style>
          </head>
          <body>

          <div class="header">
              <h1>🎂 বয়স হিসাব</h1>
              <p>আপনার সঠিক বয়স জানুন</p>
          </div>

          <div class="container">
              <div class="card">
                  <label>জন্ম তারিখ</label>
                  <input type="date" id="birthDate">
                  <button onclick="calculateAge()">বয়স হিসাব করুন</button>
              </div>

              <div class="card">
                  <div id="result">জন্ম তারিখ দিন</div>
              </div>
          </div>

          <script>
          function calculateAge() {
              const value = document.getElementById("birthDate").value;

              if (!value) {
                  document.getElementById("result").innerText =
                      "জন্ম তারিখ নির্বাচন করুন";
                  return;
              }

              const birth = new Date(value);
              const today = new Date();

              let years = today.getFullYear() - birth.getFullYear();
              let months = today.getMonth() - birth.getMonth();
              let days = today.getDate() - birth.getDate();

              if (days < 0) {
                  months--;
                  days += new Date(
                      today.getFullYear(),
                      today.getMonth(),
                      0
                  ).getDate();
              }

              if (months < 0) {
                  years--;
                  months += 12;
              }

              document.getElementById("result").innerText =
                  years + " বছর " +
                  months + " মাস " +
                  days + " দিন";
          }
          </script>

          </body>
          </html>
          EOF
          fi

      - name: Copy Other Files
        run: |
          for file in style.css script.js birthday.html rashi.html more.html manifest.json sw.js; do
            if [ -f "$file" ]; then
              cp "$file" android/app/src/main/assets/
            fi
          done

      - name: Create Signing Key
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/release-key.jks \
            -storetype JKS \
            -storepass "BoyosHisab2026" \
            -keypass "BoyosHisab2026" \
            -alias "boyoshisab" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Boyos Hisab, OU=App, O=Boyos Hisab, L=Guwahati, ST=Assam, C=IN"

      - name: Check Signing Key
        run: |
          test -f android/release-key.jks

          keytool -list \
            -keystore android/release-key.jks \
            -storepass "BoyosHisab2026" \
            -alias "boyoshisab"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew clean assembleRelease --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare Release Files
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/release/app-release.apk \
             release/Boyos-Hisab-Release.apk

          cp android/app/build/outputs/bundle/release/app-release.aab \
             release/Boyos-Hisab-Release.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Boyos-Hisab-Release
          path: release/
          if-no-files-found: error
